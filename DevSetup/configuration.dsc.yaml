# yaml-language-server: $schema=https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
# DEC (Desired Environment Configuration) - winget configure file
# This configuration handles application installations and Windows settings

$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  name: "DEC Windows Configuration"
  description: "Desired Environment Configuration for Windows development setup"
  winget:
    processor:
      identifier: "dscv3"

resources:
  # ====================================
  # WINGET CONFIGURATION
  # ====================================
  - name: WinGetUserSettingsFile
    type: Microsoft.WinGet/UserSettingsFile
    properties:
      settings: {}

  - name: WinGetAdminSettings
    type: Microsoft.WinGet/AdminSettings
    metadata:
      winget:
        securityContext: "elevated"
    properties:
      settings:
        LocalManifestFiles: false
        ProxyCommandLineOptions: false
        BypassCertificatePinningForMicrosoftStore: false
        InstallerHashOverride: false
        LocalArchiveMalwareScanOverride: false

  # ====================================
  # INSTALL MICROSOFT.WINDOWS.SETTINGS MODULE
  # ====================================
  - name: WindowsSettingsModuleInstaller
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    metadata:
      description: "Install Microsoft.Windows.Settings PowerShell module"
    properties:
      executable: "pwsh"
      arguments:
        - "-NoProfile"
        - "-NoLogo"
        - "-Command"
        - "if (-not (Get-Module -ListAvailable -Name Microsoft.Windows.Settings)) { Install-Module -Name Microsoft.Windows.Settings -Confirm:$False -Force -AllowPrerelease -AllowClobber }"

  # ====================================
  # WINDOWS SETTINGS CONFIGURATION
  # ====================================
  - name: ConfigureWindowsSettings
    type: Microsoft.Windows.Settings/WindowsSettings
    metadata:
      description: "Configure Windows UI and Developer settings"
      winget:
        securityContext: "elevated"
    dependsOn:
      - "[resourceId('Microsoft.DSC.Transitional/RunCommandOnSet', 'WindowsSettingsModuleInstaller')]"
    properties:
      SystemColorMode: "Dark"
      AppColorMode: "Dark"
      DeveloperMode: true
      TaskbarAlignment: "Left"

  # ====================================
  # CORE DEVELOPMENT TOOLS
  # ====================================
  - name: InstallGit
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Git.Git"
    properties:
      id: "Git.Git"
      source: "winget"

