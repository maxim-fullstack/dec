# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# DEC (Desired Environment Configuration) - winget configure file
# This configuration handles application installations and Windows settings

properties:
  configurationVersion: 0.2.0
  assertions:
    - resource: Microsoft.Windows.Developer/OsVersion
      directives:
        description: Verify minimum OS version
        allowPrerelease: true
      settings:
        MinVersion: "10.0.19041"
  resources:
    # ====================================
    # CORE DEVELOPMENT TOOLS
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Git version control system
        allowPrerelease: true
      settings:
        id: Git.Git
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Microsoft Visual Studio Code
        allowPrerelease: true
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install PowerShell 7
        allowPrerelease: true
      settings:
        id: Microsoft.PowerShell
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Windows Terminal
        allowPrerelease: true
      settings:
        id: Microsoft.WindowsTerminal
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Docker Desktop
        allowPrerelease: true
      settings:
        id: Docker.DockerDesktop
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Vim text editor
        allowPrerelease: true
      settings:
        id: vim.vim
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Neovim
        allowPrerelease: true
      settings:
        id: Neovim.Neovim
        source: winget

    # ====================================
    # NODE.JS & JAVASCRIPT TOOLS
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install NVM for Windows
        allowPrerelease: true
      settings:
        id: CoreyButler.NVMforWindows
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install pnpm package manager
        allowPrerelease: true
      settings:
        id: pnpm.pnpm
        source: winget

    # ====================================
    # BROWSERS & WEB DEVELOPMENT
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Google Chrome
        allowPrerelease: true
      settings:
        id: Google.Chrome
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Google Chrome Dev
        allowPrerelease: true
      settings:
        id: Google.Chrome.Dev
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Firefox Developer Edition
        allowPrerelease: true
      settings:
        id: Mozilla.Firefox.DeveloperEdition
        source: winget

    # ====================================
    # PRODUCTIVITY & OFFICE TOOLS
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install 7-Zip
        allowPrerelease: true
      settings:
        id: 7zip.7zip
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Notepad++
        allowPrerelease: true
      settings:
        id: Notepad++.Notepad++
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Grammarly for Windows
        allowPrerelease: true
      settings:
        id: Grammarly.ForWindows
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Obsidian
        allowPrerelease: true
      settings:
        id: Obsidian.Obsidian
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Microsoft Sticky Notes
        allowPrerelease: true
      settings:
        id: Microsoft.StickyNotes
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install draw.io Diagrams
        allowPrerelease: true
      settings:
        id: JGraph.Draw
        source: winget

    # ====================================
    # AZURE & CLOUD DEVELOPMENT
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Azure Data Studio
        allowPrerelease: true
      settings:
        id: Microsoft.AzureDataStudio
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Dev Home Azure Extension
        allowPrerelease: true
      settings:
        id: Microsoft.DevHomeAzureExtension
        source: winget

    # ====================================
    # GITHUB & VERSION CONTROL
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install GitHub Desktop
        allowPrerelease: true
      settings:
        id: GitHub.GitHubDesktop
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install GitHub CLI
        allowPrerelease: true
      settings:
        id: GitHub.cli
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Dev Home GitHub Extension
        allowPrerelease: true
      settings:
        id: Microsoft.DevHomeGitHubExtension
        source: winget

    # ====================================
    # SYSTEM UTILITIES & TOOLS
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install PowerToys
        allowPrerelease: true
      settings:
        id: Microsoft.PowerToys
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install DevToys
        allowPrerelease: true
      settings:
        id: DevToys-app.DevToys
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Windows Performance Analyzer
        allowPrerelease: true
      settings:
        id: Microsoft.WindowsPerformanceAnalyzer
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Sysinternals Suite
        allowPrerelease: true
      settings:
        id: Microsoft.Sysinternals
        source: winget

    # ====================================
    # TERMINAL & SHELL ENHANCEMENT
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Oh My Posh
        allowPrerelease: true
      settings:
        id: JanDeDobbeleer.OhMyPosh
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Warp terminal
        allowPrerelease: true
      settings:
        id: Warp.Warp
        source: winget

    # ====================================
    # WINDOWS SETTINGS CONFIGURATION
    # ====================================
    - resource: Microsoft.Windows.Developer/DeveloperMode
      directives:
        description: Enable Developer Mode
        allowPrerelease: true
      settings:
        Ensure: Present

    - resource: Microsoft.Windows.Settings/SystemColorMode
      directives:
        description: Set system color mode to dark
        allowPrerelease: true
      settings:
        SystemColorMode: dark

    - resource: Microsoft.Windows.Settings/AppColorMode
      directives:
        description: Set application color mode to dark
        allowPrerelease: true
      settings:
        AppColorMode: dark

    - resource: Microsoft.Windows.Settings/TaskbarAlignment
      directives:
        description: Set taskbar alignment to left
        allowPrerelease: true
      settings:
        Alignment: left

    - resource: Microsoft.Windows.Settings/TaskbarAutomaticallyHide
      directives:
        description: Configure taskbar auto-hide
        allowPrerelease: true
      settings:
        Hide: false
