# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.3
# DEC (Desired Environment Configuration) - winget configure file
# This configuration handles application installations and Windows settings

$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  name: "DEC Windows Configuration"
  description: "Desired Environment Configuration for Windows development setup"

properties:
  configurationVersion: 0.2.0
  assertions:
    - resource: Microsoft.Windows.Developer/OsVersion
      directives:
        description: Verify minimum OS version
        allowPrerelease: true
      settings:
        MinVersion: "10.0.19041"
  resources:
    # ====================================
    # INSTALL MICROSOFT.WINDOWS.SETTINGS MODULE
    # ====================================
    - resource: Microsoft.DSC.Transitional/RunCommandOnSet
      directives:
        description: Install Microsoft.Windows.Settings PowerShell module
        allowPrerelease: true
      settings:
        executable: pwsh
        arguments:
          - "-NoProfile"
          - "-NoLogo"
          - "-Command"
          - "if (-not (Get-Module -ListAvailable -Name Microsoft.Windows.Settings)) { Install-Module -Name Microsoft.Windows.Settings -Confirm:$False -Force -AllowPrerelease -AllowClobber }"

    # ====================================
    # WINDOWS SETTINGS CONFIGURATION
    # ====================================
    - resource: Microsoft.Windows.Settings/WindowsSettings
      directives:
        description: Configure Windows UI and Developer settings
        allowPrerelease: true
      settings:
        SystemColorMode: Dark
        AppColorMode: Dark
        DeveloperMode: true
        TaskbarAlignment: Left

    # ====================================
    # CORE DEVELOPMENT TOOLS
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Git version control system (Git.Git)
        module: Git.Git
        allowPrerelease: true
      settings:
        id: Git.Git
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Microsoft Visual Studio Code (Microsoft.VisualStudioCode)
        module: Microsoft.VisualStudioCode
        allowPrerelease: true
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install PowerShell 7 (Microsoft.PowerShell)
        module: Microsoft.PowerShell
        allowPrerelease: true
      settings:
        id: Microsoft.PowerShell
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Windows Terminal (Microsoft.WindowsTerminal)
        module: Microsoft.WindowsTerminal
        allowPrerelease: true
      settings:
        id: Microsoft.WindowsTerminal
        source: winget

    # - resource: Microsoft.WinGet.DSC/WinGetPackage
    #   directives:
    #     description: Install Docker Desktop (Docker.DockerDesktop)
    #     module: Docker.DockerDesktop
    #     allowPrerelease: true
    #   settings:
    #     id: Docker.DockerDesktop
    #     source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Vim text editor (vim.vim)
        module: vim.vim
        allowPrerelease: true
      settings:
        id: vim.vim
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Neovim (Neovim.Neovim)
        module: Neovim.Neovim
        allowPrerelease: true
      settings:
        id: Neovim.Neovim
        source: winget

    # ====================================
    # NODE.JS & JAVASCRIPT TOOLS
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install NVM for Windows (CoreyButler.NVMforWindows)
        module: CoreyButler.NVMforWindows
        allowPrerelease: true
      settings:
        id: CoreyButler.NVMforWindows
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install pnpm package manager (pnpm.pnpm)
        module: pnpm.pnpm
        allowPrerelease: true
      settings:
        id: pnpm.pnpm
        source: winget

    # ====================================
    # BROWSERS & WEB DEVELOPMENT
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Google Chrome (Google.Chrome)
        module: Google.Chrome
        allowPrerelease: true
      settings:
        id: Google.Chrome
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Google Chrome Dev (Google.Chrome.Dev)
        module: Google.Chrome.Dev
        allowPrerelease: true
      settings:
        id: Google.Chrome.Dev
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Firefox Developer Edition (Mozilla.Firefox.DeveloperEdition)
        module: Mozilla.Firefox.DeveloperEdition
        allowPrerelease: true
      settings:
        id: Mozilla.Firefox.DeveloperEdition
        source: winget

    # ====================================
    # PRODUCTIVITY & OFFICE TOOLS
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install 7-Zip (7zip.7zip)
        module: 7zip.7zip
        allowPrerelease: true
      settings:
        id: 7zip.7zip
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Notepad++ (Notepad++.Notepad++)
        module: Notepad++.Notepad++
        allowPrerelease: true
      settings:
        id: Notepad++.Notepad++
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Grammarly for Windows (Grammarly.ForWindows)
        module: Grammarly.ForWindows
        allowPrerelease: true
      settings:
        id: Grammarly.ForWindows
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Obsidian (Obsidian.Obsidian)
        module: Obsidian.Obsidian
        allowPrerelease: true
      settings:
        id: Obsidian.Obsidian
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Microsoft Sticky Notes (Microsoft.StickyNotes)
        module: Microsoft.StickyNotes
        allowPrerelease: true
      settings:
        id: Microsoft.StickyNotes
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install draw.io Diagrams (JGraph.Draw)
        module: JGraph.Draw
        allowPrerelease: true
      settings:
        id: JGraph.Draw
        source: winget

    # ====================================
    # AZURE & CLOUD DEVELOPMENT
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Azure Data Studio (Microsoft.AzureDataStudio)
        module: Microsoft.AzureDataStudio
        allowPrerelease: true
      settings:
        id: Microsoft.AzureDataStudio
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Dev Home Azure Extension (Microsoft.DevHomeAzureExtension)
        module: Microsoft.DevHomeAzureExtension
        allowPrerelease: true
      settings:
        id: Microsoft.DevHomeAzureExtension
        source: winget

    # ====================================
    # GITHUB & VERSION CONTROL
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install GitHub Desktop (GitHub.GitHubDesktop)
        module: GitHub.GitHubDesktop
        allowPrerelease: true
      settings:
        id: GitHub.GitHubDesktop
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install GitHub CLI (GitHub.cli)
        module: GitHub.cli
        allowPrerelease: true
      settings:
        id: GitHub.cli
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Dev Home GitHub Extension (Microsoft.DevHomeGitHubExtension)
        module: Microsoft.DevHomeGitHubExtension
        allowPrerelease: true
      settings:
        id: Microsoft.DevHomeGitHubExtension
        source: winget

    # ====================================
    # SYSTEM UTILITIES & TOOLS
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install PowerToys (Microsoft.PowerToys)
        module: Microsoft.PowerToys
        allowPrerelease: true
      settings:
        id: Microsoft.PowerToys
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install DevToys (DevToys-app.DevToys)
        module: DevToys-app.DevToys
        allowPrerelease: true
      settings:
        id: DevToys-app.DevToys
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Windows Performance Analyzer (Microsoft.WindowsPerformanceAnalyzer)
        module: Microsoft.WindowsPerformanceAnalyzer
        allowPrerelease: true
      settings:
        id: Microsoft.WindowsPerformanceAnalyzer
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Sysinternals Suite (Microsoft.Sysinternals)
        module: Microsoft.Sysinternals
        allowPrerelease: true
      settings:
        id: Microsoft.Sysinternals
        source: winget

    # ====================================
    # TERMINAL & SHELL ENHANCEMENT
    # ====================================
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Oh My Posh (JanDeDobbeleer.OhMyPosh)
        module: JanDeDobbeleer.OhMyPosh
        allowPrerelease: true
      settings:
        id: JanDeDobbeleer.OhMyPosh
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install Warp terminal (Warp.Warp)
        module: Warp.Warp
        allowPrerelease: true
      settings:
        id: Warp.Warp
        source: winget

    # ====================================
    # WINDOWS SETTINGS CONFIGURATION
    # ====================================
    - resource: Microsoft.Windows.Developer/DeveloperMode
      directives:
        description: Enable Developer Mode
        allowPrerelease: true
      settings:
        Ensure: Present
