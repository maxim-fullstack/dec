# Puppet configuration for masterless mode
# This file configures Puppet to run in masterless mode

[main]
    # Disable SSL verification for masterless mode
    ssl_client_ca_auth = false
    
    # Set the module path
    modulepath = modules
    
    # Set the manifest path
    manifest = manifests/site.pp
    
    # Configure Hiera
    hiera_config = config/hiera.yaml
    
    # Logging configuration
    log_level = info
    
    # Disable certificate checking in masterless mode
    ca_server = 
    
    # Puppet environment configuration
    environment = production
    
    # Enable detailed exit codes
    detailed_exitcodes = true

[agent]
    # Disable the agent daemon
    daemonize = false
    
    # Disable SSL in masterless mode
    ca_server = 
    
    # Set run interval (not used in masterless mode)
    runinterval = 0
