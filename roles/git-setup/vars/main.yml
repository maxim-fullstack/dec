---
# Git Setup Role Variables
git_packages:
  windows:
    - Git.Git
  linux:
    - git

git_config_defaults:
  core:
    autocrlf: "{{ 'true' if ansible_system == 'Win32NT' else 'input' }}"
    editor: "{{ 'code --wait' if 'code' in ansible_env.PATH | default('') else 'vim' }}"
    filemode: "{{ 'false' if ansible_system == 'Win32NT' else 'true' }}"
  push:
    autoSetupRemote: true
  pull:
    ff: only
  init:
    defaultBranch: "{{ git.default_branch | default('main') }}"

ssh_key_defaults:
  type: "ed25519"
  bits: 4096
  comment: "{{ git.user_email | default(user.email) }}"
