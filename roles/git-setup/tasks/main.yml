---
# Git Setup Role - Main Tasks
- name: Include platform-specific tasks
  include_tasks: "{{ ansible_system | lower }}.yml"

- name: Configure Git user name
  git_config:
    name: user.name
    value: "{{ git.user_name }}"
    scope: global
  tags: [git-config]

- name: Configure Git user email
  git_config:
    name: user.email
    value: "{{ git.user_email }}"
    scope: global
  tags: [git-config]

- name: Configure Git default branch
  git_config:
    name: init.defaultBranch
    value: "{{ git.default_branch | default('main') }}"
    scope: global
  tags: [git-config]

- name: Configure Git push default
  git_config:
    name: push.default
    value: "{{ git.push_default | default('simple') }}"
    scope: global
  tags: [git-config]

- name: Configure Git pull rebase
  git_config:
    name: pull.rebase
    value: "{{ git.pull_rebase | default(true) }}"
    scope: global
  tags: [git-config]

- name: Set up Git aliases
  git_config:
    name: "alias.{{ item.key }}"
    value: "{{ item.value }}"
    scope: global
  loop: "{{ git.aliases | dict2items }}"
  when: git.aliases is defined
  tags: [git-aliases]

- name: Generate SSH key if needed
  openssh_keypair:
    path: "{{ ansible_user_dir }}/.ssh/id_{{ ssh.key_type | default('ed25519') }}"
    type: "{{ ssh.key_type | default('ed25519') }}"
    comment: "{{ ssh.key_comment | default(git.user_email) }}"
  when:
    - ssh.generate_key | default(true)
    - ansible_system != 'Win32NT'
  tags: [ssh-key]

- name: Display SSH public key
  slurp:
    src: "{{ ansible_user_dir }}/.ssh/id_{{ ssh.key_type | default('ed25519') }}.pub"
  register: ssh_public_key
  when:
    - ssh.generate_key | default(true)
    - ansible_system != 'Win32NT'
  tags: [ssh-key]

- name: Show SSH public key
  debug:
    msg:
      - "SSH public key generated:"
      - "{{ ssh_public_key.content | b64decode }}"
  when:
    - ssh_public_key is defined
    - ssh_public_key.content is defined
  tags: [ssh-key]
