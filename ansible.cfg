# Ansible configuration file for DEC

[defaults]
# Inventory file
inventory = inventory/hosts.yml

# Disable host key checking for localhost
host_key_checking = False

# Use local connection by default
transport = local

# Retry files
retry_files_enabled = False

# Display settings
stdout_callback = yaml
bin_ansible_callbacks = True

# Fact caching
gathering = smart
fact_caching = memory
fact_caching_timeout = 86400

# Roles path
roles_path = roles

# Library path
library = library

# Vault settings
vault_password_file = .vault_pass

[ssh_connection]
# SSH settings for remote connections
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes

[inventory]
# Inventory settings
enable_plugins = yaml, ini, auto

[privilege_escalation]
# Become settings
become_ask_pass = False
