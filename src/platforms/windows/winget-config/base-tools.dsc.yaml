  # ====================================
  # SYSTEM UTILITIES & TOOLS
  # ====================================
  - name: InstallPowerToys
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Microsoft.PowerToys"
    properties:
      id: "Microsoft.PowerToys"
      source: "winget"

  - name: InstallDevToys
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install DevToys-app.DevToys"
    properties:
      id: "DevToys-app.DevToys"
      source: "winget"

  - name: InstallWindowsPerformanceAnalyzer
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Microsoft.WindowsPerformanceAnalyzer"
    properties:
      id: "Microsoft.WindowsPerformanceAnalyzer"
      source: "winget"

  - name: InstallSysinternals
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Microsoft.Sysinternals"
    properties:
      id: "Microsoft.Sysinternals"
      source: "winget"

  # ====================================
  # TERMINAL & SHELL ENHANCEMENT
  # ====================================
  - name: InstallOhMyPosh
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install JanDeDobbeleer.OhMyPosh"
    properties:
      id: "JanDeDobbeleer.OhMyPosh"
      source: "winget"

  - name: InstallWarpTerminal
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Warp.Warp"
    properties:
      id: "Warp.Warp"
      source: "winget"
