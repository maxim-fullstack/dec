# DEC Base Tools Configuration
# This configuration handles essential system utilities and productivity tools
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.3

$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  name: "DEC Base Tools"
  description: "Essential system utilities and productivity applications"
  winget:
    processor:
      identifier: "dscv3"

resources:
  # ====================================
  # PRODUCTIVITY & OFFICE TOOLS
  # ====================================
  - name: Install7Zip
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install 7zip.7zip"
    properties:
      id: "7zip.7zip"
      source: "winget"

  - name: InstallNotepadPlusPlus
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Notepad++.Notepad++"
    properties:
      id: "Notepad++.Notepad++"
      source: "winget"

