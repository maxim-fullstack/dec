# DEC User Preferences Configuration
# This configuration handles Windows UI and user experience settings
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.3

$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  name: "DEC User Preferences"
  description: "Windows UI and Developer preferences configuration"
  winget:
    processor:
      identifier: "dscv3"

resources:
  # ====================================
  # WINDOWS SETTINGS CONFIGURATION
  # ====================================
  - name: ConfigureWindowsSettings
    type: Microsoft.Windows.Settings/WindowsSettings
    metadata:
      description: "Configure Windows UI and Developer settings"
      winget:
        securityContext: "elevated"
    properties:
      SystemColorMode: "Dark"
      AppColorMode: "Dark"
      DeveloperMode: true
      TaskbarAlignment: "Left"

  # ====================================
  # TASKBAR CONFIGURATION
  # ====================================
  - name: EnableTaskbarAutoHide
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    metadata:
      description: "Enable Taskbar Auto-Hide functionality"
      winget:
        securityContext: "current"
    properties:
      executable: "powershell"
      arguments:
        - "-NoProfile"
        - "-Command"
        - "$registryPath = 'HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\StuckRects3'; $currentSettings = Get-ItemProperty -Path $registryPath -Name 'Settings' -ErrorAction SilentlyContinue; if ($currentSettings) { $settings = $currentSettings.Settings; $settings[8] = $settings[8] -bor 0x01; Set-ItemProperty -Path $registryPath -Name 'Settings' -Value $settings; Stop-Process -Name explorer -Force; Start-Sleep -Seconds 2; }"
