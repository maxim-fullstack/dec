# DEC Developer Tools Configuration
# This configuration handles core development tools and version control
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.3

$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  name: "DEC Developer Tools"
  description: "Core development tools and version control systems"
  winget:
    processor:
      identifier: "dscv3"

resources:
  # ====================================
  # CORE DEVELOPMENT TOOLS
  # ====================================
  - name: InstallGit
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Git.Git"
    properties:
      id: "Git.Git"
      source: "winget"

  - name: InstallVisualStudioCode
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Microsoft.VisualStudioCode"
    properties:
      id: "Microsoft.VisualStudioCode"
      source: "winget"

  - name: InstallPowerShell
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Microsoft.PowerShell"
    properties:
      id: "Microsoft.PowerShell"
      source: "winget"

  - name: InstallWindowsTerminal
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Microsoft.WindowsTerminal"
    properties:
      id: "Microsoft.WindowsTerminal"
      source: "winget"

  # - name: Install Docker Desktop
  #   type: Microsoft.WinGet/Package
  #   metadata:
  #     description: "Install Docker.DockerDesktop"
  #   properties:
  #     id: "Docker.DockerDesktop"
  #     source: "winget"

  - name: InstallVim
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install vim.vim"
    properties:
      id: "vim.vim"
      source: "winget"

  - name: InstallNeovim
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Neovim.Neovim"
    properties:
      id: "Neovim.Neovim"
      source: "winget"

  # ====================================
  # BROWSERS & WEB DEVELOPMENT
  # ====================================
  - name: InstallGoogleChrome
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Google.Chrome"
    properties:
      id: "Google.Chrome"
      source: "winget"

  - name: InstallGoogleChromeDev
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Google.Chrome.Dev"
    properties:
      id: "Google.Chrome.Dev"
      source: "winget"

  - name: InstallFirefoxDeveloperEdition
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Mozilla.Firefox.DeveloperEdition"
    properties:
      id: "Mozilla.Firefox.DeveloperEdition"
      source: "winget"

  # ====================================
  # AZURE & CLOUD DEVELOPMENT
  # ====================================
  # - name: InstallAzureDataStudio
  #   type: Microsoft.WinGet/Package
  #   metadata:
  #     description: "Install Microsoft.AzureDataStudio"
  #   properties:
  #     id: "Microsoft.AzureDataStudio"
  #     source: "winget"

  - name: InstallDevHomeAzureExtension
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Microsoft.DevHomeAzureExtension"
    properties:
      id: "Microsoft.DevHomeAzureExtension"
      source: "winget"

  # ====================================
  # GITHUB & VERSION CONTROL
  # ====================================
  - name: InstallGitHubDesktop
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install GitHub.GitHubDesktop"
    properties:
      id: "GitHub.GitHubDesktop"
      source: "winget"

  - name: InstallGitHubCLI
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install GitHub.cli"
    properties:
      id: "GitHub.cli"
      source: "winget"

  - name: InstallDevHomeGitHubExtension
    type: Microsoft.WinGet/Package
    metadata:
      description: "Install Microsoft.DevHomeGitHubExtension"
    properties:
      id: "Microsoft.DevHomeGitHubExtension"
      source: "winget"
